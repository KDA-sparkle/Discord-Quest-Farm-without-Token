<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14080F">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quest Farm">
  <title>Quest Farm</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Ecran d'appairage (code a 6 chiffres affiche sur le PC) -->
  <section id="pair" class="pair" hidden>
    <img src="/icon-192.png" alt="" class="pair-logo">
    <h1>Quest <em>Farm</em></h1>
    <p class="eyebrow"><span class="blink-dot"></span><span id="tagline"></span></p>
    <p id="pair-text"></p>
    <input id="pin" class="pin" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <button id="pair-btn" class="btn primary wide"></button>
    <p id="pair-error" class="error" hidden></p>
  </section>

  <!-- Appli -->
  <div id="app" class="app" hidden>
    <header class="top">
      <img src="/icon-192.png" alt="" class="logo">
      <div class="title">Quest <em>Farm</em></div>
      <div id="discord" class="badge"><span class="dot"></span><span id="discord-text"></span></div>
    </header>
    <div id="offline" class="offline" hidden></div>

    <main>
      <section id="view-home" class="view"></section>
      <section id="view-games" class="view" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        </div>
        <div id="results" class="list"></div>
      </section>
      <section id="view-quest" class="view" hidden></section>
      <section id="view-stats" class="view" hidden></section>
      <p class="termlog"><span class="prompt">&gt;</span> <span id="log-text"></span><span class="cursor"></span></p>
    </main>

    <nav class="tabs">
      <button data-tab="home" class="active"></button>
      <button data-tab="games"></button>
      <button data-tab="quest"></button>
      <button data-tab="stats"></button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
